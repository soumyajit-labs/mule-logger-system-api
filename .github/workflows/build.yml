name: Build and Deploy to Anypoint Platform

on:
  push:
    branches:
    - dev
    - prod

env:
  ENV: ${{ vars.ENV }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  variable-printer:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: List Releases
        run: gh release list --repo soumyajit-labs/common-settings
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_REPO_TOKEN }}
      
      - name: Fetch asset
        run: gh release download --repo soumyajit-labs/common-settings/secrets-appender --pattern '*.py' 
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_REPO_TOKEN }}

      - name: See what we downloaded
        run: ls

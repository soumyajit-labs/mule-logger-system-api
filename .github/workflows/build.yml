
name: Build and Deploy to Anypoint Platform

on:
  push:
    branches:
    - dev
    - prod

env:
  ENV: ${{ vars.ENV }}

jobs:
  variable-printer:
    runs-on: ubuntu-latest
    steps:
    - name: Print an Org variable
      run: echo "CONNECTEDAPPPASS value is ${{ secrets.CONNECTEDAPPPASS }}"
    - name: Print an Env variable
      run: echo "DEV ENV value is ${{ env.ENV }}"

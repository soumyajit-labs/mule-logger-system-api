
name: Build and Deploy to Anypoint Platform

on:
  push:
    branches:
    - dev
    - prod

env:
  ENV: ${{ vars.ENV }}

jobs:
  variable-printer:
    runs-on: ubuntu-latest
    environment: |
      if [ endsWith(github.ref, '/dev') ]; then
        echo "ENVIRONMENT=dev" >> $GITHUB_ENV
      elif [ endsWith(github.ref, '/prod') ]; then
        echo "ENVIRONMENT=prod" >> $GITHUB_ENV
      else
        echo "ENVIRONMENT=default" >> $GITHUB_ENV
      fi
    steps:
    - name: Print an Org variable
      run: echo "CONNECTEDAPPPASS value is ${{ secrets.CONNECTEDAPPPASS }}"
    - name: Print an Env variable
      run: echo "DEV ENV value is ${{ env.ENV }}"
    - name: Print Github Context
      run: echo "${{ github.ref }}"
    - name: Print Github Current Env
      run: echo "${{ env.ENVIRONMENT }}"
